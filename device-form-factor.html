<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Device form-factor detection</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; }
    pre {
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: #111;
      color: #d8ffd8;
    }
    .flags {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 16px 0 24px;
    }
    .flag {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .flag.on { background: #e8f8e8; }
    .flag.off { background: #f4f4f4; }
    .note {
      max-width: 720px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>折叠屏 / 宽屏 / iPhone Duo 横屏检测</h1>
  <p class="note">
    标准 API 只能判断<strong>当前是否跨折缝或处于 folded 姿态</strong>，
    无法在完全展开时稳定识别「这是折叠屏硬件」。Safari 未实现相关 API，
    iPhone Duo 只能用视口尺寸启发式匹配。
  </p>
  <div class="flags" id="flags"></div>
  <pre id="output">loading…</pre>

  <script type="module">
    import { subscribeDeviceFormFactor } from './js/device-form-factor.js';

    var labels = [
      ['isFoldableSpanning', '折叠屏跨折缝 / 双屏 spanning'],
      ['isFoldedPosture', 'Device Posture = folded'],
      ['isWideScreen', '宽屏（宽/高 ≥ 16:9）'],
      ['isLandscapeMobile', '移动设备横屏（宽 > 高）'],
      ['isIphoneDuo', '疑似 iPhone Duo'],
      ['isIphoneDuoLandscape', 'iPhone Duo 且宽 > 高']
    ];

    var flagsEl = document.getElementById('flags');
    var outputEl = document.getElementById('output');

    subscribeDeviceFormFactor(function (snapshot) {
      flagsEl.innerHTML = labels.map(function (item) {
        var on = Boolean(snapshot[item[0]]);
        return '<div class="flag ' + (on ? 'on' : 'off') + '"><strong>' +
          item[1] + '</strong><div>' + String(on) + '</div></div>';
      }).join('');

      outputEl.textContent = JSON.stringify(snapshot, function (key, value) {
        if (key === 'segments') {
          return (value || []).map(function (segment) {
            return {
              x: segment.x,
              y: segment.y,
              width: segment.width,
              height: segment.height
            };
          });
        }
        return value;
      }, 2);
    });
  </script>
</body>
</html>
